name: Dependency Freshness Check

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Check for outdated packages
        id: outdated
        run: |
          echo "## Outdated Packages Report" > report.md
          echo "" >> report.md
          echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> report.md
          echo "" >> report.md

          # Get outdated packages as JSON
          npm outdated --json > outdated.json 2>/dev/null || true

          # Parse and flag packages where wanted != current (within semver)
          STALE_COUNT=0
          HAS_CRITICAL=false

          if [ -s outdated.json ] && [ "$(cat outdated.json)" != "{}" ]; then
            echo "| Package | Current | Wanted | Latest | Type |" >> report.md
            echo "|---------|---------|--------|--------|------|" >> report.md

            for pkg in $(node -e "const d=require('./outdated.json'); Object.keys(d).forEach(k => console.log(k))"); do
              CURRENT=$(node -e "console.log(require('./outdated.json')['$pkg'].current || 'N/A')")
              WANTED=$(node -e "console.log(require('./outdated.json')['$pkg'].wanted || 'N/A')")
              LATEST=$(node -e "console.log(require('./outdated.json')['$pkg'].latest || 'N/A')")
              TYPE=$(node -e "console.log(require('./outdated.json')['$pkg'].type || 'N/A')")

              if [ "$CURRENT" != "$WANTED" ]; then
                echo "| **$pkg** | $CURRENT | $WANTED | $LATEST | $TYPE |" >> report.md
                STALE_COUNT=$((STALE_COUNT + 1))
              else
                echo "| $pkg | $CURRENT | $WANTED | $LATEST | $TYPE |" >> report.md
              fi
            done

            echo "" >> report.md
            echo "**$STALE_COUNT package(s) behind wanted version (within semver range).**" >> report.md

            # Fail if any packages within semver range are outdated
            if [ "$STALE_COUNT" -gt 0 ]; then
              HAS_CRITICAL=true
            fi
          else
            echo "All packages are up to date." >> report.md
          fi

          cat report.md >> "$GITHUB_STEP_SUMMARY"

          if [ "$HAS_CRITICAL" = true ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::warning::$STALE_COUNT package(s) have newer versions within semver range. Run 'npm update' to update."
          fi

      - name: Create issue if stale
        if: steps.outdated.outputs.stale == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');
            const title = `deps: ${new Date().toISOString().slice(0,10)} — outdated packages detected`;

            // Check if an open issue already exists
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies',
              per_page: 5,
            });
            const existing = issues.find(i => i.title.startsWith('deps:'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: report,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: report,
                labels: ['dependencies'],
              });
            }
